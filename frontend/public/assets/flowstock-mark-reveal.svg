<svg xmlns="http://www.w3.org/2000/svg" class="fs-m" viewBox="20 18 80 84" width="80" height="84" role="img" aria-label="FlowStock" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>FlowStock</title>
  <style>
    /* resting state is the default; every animation only describes the way in */
    .fs-m{--out:cubic-bezier(.16,1,.3,1);--io:cubic-bezier(.65,0,.35,1);--pop:cubic-bezier(.34,1.56,.64,1)}
    .fs-m-fill,.fs-m-dot,.fs-m-halo{transform-box:fill-box;transform-origin:center}

    .fs-m-edge{stroke-dasharray:100 110;animation:fs-m-draw .8s var(--io) .06s both}
    .fs-m-fill{animation:fs-m-fade .38s var(--out) .6s both}
    .fs-m-bar{stroke-dasharray:100 110;animation:fs-m-draw .7s var(--out) .74s both}
    .fs-m-dot{animation:fs-m-pop .5s var(--pop) .81s both}
    .fs-m-halo{opacity:0;animation:fs-m-ring 1s var(--out) .99s forwards}

    @keyframes fs-m-draw{from{stroke-dashoffset:104}}
    @keyframes fs-m-fade{from{opacity:0}}
    @keyframes fs-m-pop{from{opacity:0;transform:scale(0)}}
    @keyframes fs-m-ring{from{opacity:.55;transform:scale(.4)}to{opacity:0;transform:scale(3.4)}}

    @media (prefers-reduced-motion:reduce){.fs-m-edge,.fs-m-fill,.fs-m-bar,.fs-m-dot,.fs-m-halo{animation:none}}
  </style>

  <path class="fs-m-fill" d="M60 29 86.85 44.5 86.85 75.5 60 91 33.15 75.5 33.15 44.5Z" fill="#23262F"/>
  <g fill="none" stroke="#23262F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path class="fs-m-edge" pathLength="100" d="M60 30.39 34.35 45.19 34.35 74.81 60 89.61"/>
    <path class="fs-m-edge" pathLength="100" d="M60 30.39 85.65 45.19 85.65 74.81 60 89.61"/>
  </g>
  <path class="fs-m-bar" pathLength="100" d="M60 26.6V93.4" fill="none" stroke="#B6FF2E" stroke-width="2" stroke-linecap="round"/>
  <circle class="fs-m-halo" cx="60" cy="60" r="3.5" fill="none" stroke="#B6FF2E" stroke-width="1.4"/>
  <circle class="fs-m-dot" cx="60" cy="60" r="3.5" fill="#B6FF2E"/>
</svg>
