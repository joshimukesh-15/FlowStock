<svg xmlns="http://www.w3.org/2000/svg" class="fs-l" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Loading" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Loading</title>
  <style>
    /* resting state is the default; animations only describe the motion */
    .fs-l{--out:cubic-bezier(.16,1,.3,1)}
    .fs-l-dot,.fs-l-halo{transform-box:fill-box;transform-origin:center}

    /* a head-aligned comet: four stacked dashes give a tail that fades */
    .fs-l-t1{stroke-dasharray:34 66;opacity:0;animation:fs-l-o1 1.9s linear infinite}
    .fs-l-t2{stroke-dasharray:22 78;opacity:0;animation:fs-l-o2 1.9s linear infinite}
    .fs-l-t3{stroke-dasharray:12 88;opacity:0;animation:fs-l-o3 1.9s linear infinite}
    .fs-l-t4{stroke-dasharray:5 95;opacity:0;animation:fs-l-o4 1.9s linear infinite}
    .fs-l-bar{animation:fs-l-bar 1.9s cubic-bezier(.4,0,.2,1) infinite}
    .fs-l-dot{animation:fs-l-beat 1.9s cubic-bezier(.4,0,.2,1) infinite}
    .fs-l-halo{opacity:0;animation:fs-l-ring 1.9s var(--out) infinite}
    .fs-l-still{opacity:0}

    @keyframes fs-l-o1{from{stroke-dashoffset:34;opacity:.16}to{stroke-dashoffset:-66;opacity:.16}}
    @keyframes fs-l-o2{from{stroke-dashoffset:22;opacity:.3}to{stroke-dashoffset:-78;opacity:.3}}
    @keyframes fs-l-o3{from{stroke-dashoffset:12;opacity:.6}to{stroke-dashoffset:-88;opacity:.6}}
    @keyframes fs-l-o4{from{stroke-dashoffset:5;opacity:1}to{stroke-dashoffset:-95;opacity:1}}
    @keyframes fs-l-bar{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes fs-l-beat{0%,42%,74%,100%{transform:scale(1)}54%{transform:scale(1.34)}}
    @keyframes fs-l-ring{0%,49%{opacity:0;transform:scale(.5)}50%{opacity:.5;transform:scale(.5)}100%{opacity:0;transform:scale(3)}}
    @keyframes fs-l-pulse{0%,100%{opacity:.08}50%{opacity:.5}}

    /* reduced motion: no travel, just a slow fade so it still reads as "working" */
    @media (prefers-reduced-motion:reduce){
      .fs-l-t1,.fs-l-t2,.fs-l-t3,.fs-l-t4,.fs-l-halo,.fs-l-dot,.fs-l-bar{animation:none}
      .fs-l-still{animation:fs-l-pulse 1.9s ease-in-out infinite}
    }
  </style>

  <rect x=".9" y=".9" width="118.2" height="118.2" rx="26" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.8"/>

  <path d="M60 29 86.85 44.5 86.85 75.5 60 91 33.15 75.5 33.15 44.5Z" fill="#23262F"/>

  <g fill="none" stroke="#B6FF2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path class="fs-l-t1" pathLength="100" d="M60 30.39 85.65 45.19 85.65 74.81 60 89.61 34.35 74.81 34.35 45.19Z"/>
    <path class="fs-l-t2" pathLength="100" d="M60 30.39 85.65 45.19 85.65 74.81 60 89.61 34.35 74.81 34.35 45.19Z"/>
    <path class="fs-l-t3" pathLength="100" d="M60 30.39 85.65 45.19 85.65 74.81 60 89.61 34.35 74.81 34.35 45.19Z"/>
    <path class="fs-l-t4" pathLength="100" d="M60 30.39 85.65 45.19 85.65 74.81 60 89.61 34.35 74.81 34.35 45.19Z"/>
    <path class="fs-l-still" d="M60 30.39 85.65 45.19 85.65 74.81 60 89.61 34.35 74.81 34.35 45.19Z"/>
  </g>

  <path class="fs-l-bar" d="M60 26.6V93.4" fill="none" stroke="#B6FF2E" stroke-width="2" stroke-linecap="round"/>

  <circle class="fs-l-halo" cx="60" cy="60" r="3.5" fill="none" stroke="#B6FF2E" stroke-width="1.4"/>
  <circle class="fs-l-dot" cx="60" cy="60" r="3.5" fill="#B6FF2E"/>
</svg>
