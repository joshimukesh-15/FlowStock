<svg xmlns="http://www.w3.org/2000/svg" class="fs-loader" viewBox="90 90 320 320" width="120" height="120" role="img" aria-label="Loading FlowStock">
  <title>Loading FlowStock</title>
  <defs>
    <linearGradient id="ldr-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#d4b896"/>
    </linearGradient>
    <linearGradient id="ldr-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ldr-l3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ldr-l2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="ldr-l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="ldr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    .fs-loader { --ease: cubic-bezier(0.4, 0, 0.2, 1); }
    .pulse-base { animation: ldr-pulse 2.2s var(--ease) infinite; transform-origin: 250px 250px; }
    .wave-1 { animation: ldr-wave 2.2s var(--ease) infinite 0.1s; transform-origin: 250px 250px; }
    .wave-2 { animation: ldr-wave 2.2s var(--ease) infinite 0.25s; transform-origin: 250px 250px; }
    .wave-3 { animation: ldr-wave 2.2s var(--ease) infinite 0.4s; transform-origin: 250px 250px; }
    .wave-leaf { animation: ldr-wave 2.2s var(--ease) infinite 0.55s; transform-origin: 250px 250px; }
    
    @keyframes ldr-pulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes ldr-wave {
      0%, 100% { opacity: 0.85; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse-base, .wave-1, .wave-2, .wave-3, .wave-leaf { animation: none; }
    }
  </style>

  <g filter="url(#ldr-glow)">
    <!-- Base Beige/Cream Bottom Half Circle -->
    <path class="pulse-base" d="M 125,250 A 125,125 0 0,0 375,250 Z" fill="url(#ldr-base)"/>

    <!-- Leaflets with sequential wave motion -->
    <g class="wave-1">
      <path d="M 125,210 C 145,210 170,215 170,230 L 170,250 C 140,250 125,235 125,210 Z" fill="url(#ldr-l1)"/>
      <path d="M 125,210 C 145,225 170,240 170,250" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
    </g>

    <g class="wave-2">
      <path d="M 170,175 C 190,175 210,185 210,205 L 210,250 C 185,250 170,240 170,220 Z" fill="url(#ldr-l2)"/>
      <path d="M 170,175 C 190,200 210,225 210,250" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
    </g>

    <g class="wave-3">
      <path d="M 210,140 C 230,140 250,150 250,175 L 250,250 C 220,250 210,240 210,220 Z" fill="url(#ldr-l3)"/>
      <path d="M 210,140 C 230,170 250,210 250,250" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
    </g>

    <g class="wave-leaf">
      <path d="M 250,125 A 125,125 0 0,1 375,250 L 250,250 Z" fill="url(#ldr-leaf)"/>
      <path d="M 250,125 Q 310,185 375,250" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.45"/>
      <path d="M 250,165 Q 295,205 340,250" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
      <path d="M 250,205 Q 280,225 305,250" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.25"/>
    </g>
  </g>
</svg>
