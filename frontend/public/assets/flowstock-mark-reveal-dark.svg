<svg xmlns="http://www.w3.org/2000/svg" viewBox="95 95 310 310" width="80" height="80" role="img" aria-label="FlowStock">
  <title>FlowStock</title>
  <style>
    .fs-m{--out:cubic-bezier(.16,1,.3,1);--io:cubic-bezier(.65,0,.35,1);--pop:cubic-bezier(.34,1.56,.64,1)}
    .fs-base{animation:fs-fade .4s var(--out) .1s both}
    .fs-leaf{animation:fs-fade .4s var(--out) .2s both}
    .fs-c3{animation:fs-fade .35s var(--out) .35s both}
    .fs-c2{animation:fs-fade .35s var(--out) .45s both}
    .fs-c1{animation:fs-fade .35s var(--out) .55s both}
    @keyframes fs-fade{from{opacity:0;transform:translateY(6px)}}
    @media(prefers-reduced-motion:reduce){.fs-base,.fs-leaf,.fs-c3,.fs-c2,.fs-c1{animation:none}}
  </style>
  <defs>
    <linearGradient id="d-beige" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#d4b896"/>
    </linearGradient>
    <linearGradient id="d-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="d-l3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="d-l2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="d-l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <path class="fs-base" d="M 125,250 A 125,125 0 0,0 375,250 Z" fill="url(#d-beige)"/>
  <g class="fs-leaf">
    <path d="M 250,125 A 125,125 0 0,1 375,250 L 250,250 Z" fill="url(#d-leaf)"/>
    <path d="M 250,125 Q 310,185 375,250" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.4"/>
  </g>
  <g class="fs-c3">
    <path d="M 210,140 C 230,140 250,150 250,175 L 250,250 C 220,250 210,240 210,220 Z" fill="url(#d-l3)"/>
    <path d="M 210,140 C 230,170 250,210 250,250" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.3"/>
  </g>
  <g class="fs-c2">
    <path d="M 170,175 C 190,175 210,185 210,205 L 210,250 C 185,250 170,240 170,220 Z" fill="url(#d-l2)"/>
    <path d="M 170,175 C 190,200 210,225 210,250" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.3"/>
  </g>
  <g class="fs-c1">
    <path d="M 125,210 C 145,210 170,215 170,230 L 170,250 C 140,250 125,235 125,210 Z" fill="url(#d-l1)"/>
    <path d="M 125,210 C 145,225 170,240 170,250" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.3"/>
  </g>
</svg>
