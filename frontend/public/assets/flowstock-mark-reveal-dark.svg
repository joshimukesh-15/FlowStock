<svg xmlns="http://www.w3.org/2000/svg" class="fs-md" viewBox="20 18 80 84" width="80" height="84" role="img" aria-label="FlowStock" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>FlowStock</title>
  <style>
    /* resting state is the default; every animation only describes the way in */
    .fs-md{--out:cubic-bezier(.16,1,.3,1);--io:cubic-bezier(.65,0,.35,1);--pop:cubic-bezier(.34,1.56,.64,1)}
    .fs-md-fill,.fs-md-dot,.fs-md-halo{transform-box:fill-box;transform-origin:center}

    .fs-md-edge{stroke-dasharray:100 110;animation:fs-md-draw .8s var(--io) .06s both}
    .fs-md-fill{animation:fs-md-fade .38s var(--out) .6s both}
    .fs-md-bar{stroke-dasharray:100 110;animation:fs-md-draw .7s var(--out) .74s both}
    .fs-md-dot{animation:fs-md-pop .5s var(--pop) .81s both}
    .fs-md-halo{opacity:0;animation:fs-md-ring 1s var(--out) .99s forwards}

    @keyframes fs-md-draw{from{stroke-dashoffset:104}}
    @keyframes fs-md-fade{from{opacity:0}}
    @keyframes fs-md-pop{from{opacity:0;transform:scale(0)}}
    @keyframes fs-md-ring{from{opacity:.55;transform:scale(.4)}to{opacity:0;transform:scale(3.4)}}

    @media (prefers-reduced-motion:reduce){.fs-md-edge,.fs-md-fill,.fs-md-bar,.fs-md-dot,.fs-md-halo{animation:none}}
  </style>

  <path class="fs-md-fill" d="M60 29 86.85 44.5 86.85 75.5 60 91 33.15 75.5 33.15 44.5Z" fill="#23262F"/>
  <g fill="none" stroke="#5F6677" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path class="fs-md-edge" pathLength="100" d="M60 29.69 33.75 44.85 33.75 75.15 60 90.31"/>
    <path class="fs-md-edge" pathLength="100" d="M60 29.69 86.25 44.85 86.25 75.15 60 90.31"/>
  </g>
  <path class="fs-md-bar" pathLength="100" d="M60 26.6V93.4" fill="none" stroke="#B6FF2E" stroke-width="2" stroke-linecap="round"/>
  <circle class="fs-md-halo" cx="60" cy="60" r="3.5" fill="none" stroke="#B6FF2E" stroke-width="1.4"/>
  <circle class="fs-md-dot" cx="60" cy="60" r="3.5" fill="#B6FF2E"/>
</svg>
