<svg xmlns="http://www.w3.org/2000/svg" class="fs-r" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="FlowStock" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>FlowStock</title>
  <style>
    /* resting state is the default; every animation only describes the way in */
    .fs-r{--out:cubic-bezier(.16,1,.3,1);--io:cubic-bezier(.65,0,.35,1);--pop:cubic-bezier(.34,1.56,.64,1)}
    .fs-r-tile,.fs-r-fill,.fs-r-dot,.fs-r-halo{transform-box:fill-box;transform-origin:center}

    .fs-r-tile{animation:fs-r-tile .6s var(--out) both}
    .fs-r-edge{stroke-dasharray:100 110;animation:fs-r-draw .8s var(--io) .18s both}
    .fs-r-fill{animation:fs-r-fade .38s var(--out) .72s both}
    .fs-r-bar{stroke-dasharray:100 110;animation:fs-r-draw .7s var(--out) .86s both}
    .fs-r-dot{animation:fs-r-pop .5s var(--pop) .93s both}
    .fs-r-halo{opacity:0;animation:fs-r-ring 1s var(--out) 1.11s forwards}

    @keyframes fs-r-tile{from{opacity:0;transform:scale(.94)}}
    @keyframes fs-r-draw{from{stroke-dashoffset:104}}
    @keyframes fs-r-fade{from{opacity:0}}
    @keyframes fs-r-pop{from{opacity:0;transform:scale(0)}}
    @keyframes fs-r-ring{from{opacity:.55;transform:scale(.4)}to{opacity:0;transform:scale(3.4)}}

    @media (prefers-reduced-motion:reduce){.fs-r-edge,.fs-r-fill,.fs-r-bar,.fs-r-dot,.fs-r-halo,.fs-r-tile{animation:none}}
  </style>

  <g class="fs-r-tile">
    <rect x=".9" y=".9" width="118.2" height="118.2" rx="26" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.8"/>
    <path class="fs-r-fill" d="M60 29 86.85 44.5 86.85 75.5 60 91 33.15 75.5 33.15 44.5Z" fill="#23262F"/>
    <g fill="none" stroke="#23262F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path class="fs-r-edge" pathLength="100" d="M60 30.39 34.35 45.19 34.35 74.81 60 89.61"/>
      <path class="fs-r-edge" pathLength="100" d="M60 30.39 85.65 45.19 85.65 74.81 60 89.61"/>
    </g>
    <path class="fs-r-bar" pathLength="100" d="M60 26.6V93.4" fill="none" stroke="#B6FF2E" stroke-width="2" stroke-linecap="round"/>
    <circle class="fs-r-halo" cx="60" cy="60" r="3.5" fill="none" stroke="#B6FF2E" stroke-width="1.4"/>
    <circle class="fs-r-dot" cx="60" cy="60" r="3.5" fill="#B6FF2E"/>
  </g>
</svg>
