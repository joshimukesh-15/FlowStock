<svg xmlns="http://www.w3.org/2000/svg" class="fs-reveal" viewBox="90 90 320 320" width="120" height="120" role="img" aria-label="FlowStock">
  <title>FlowStock</title>
  <defs>
    <linearGradient id="rvl-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#d4b896"/>
    </linearGradient>
    <linearGradient id="rvl-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="rvl-l3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="rvl-l2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="rvl-l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="rvl-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#031b4e" flood-opacity="0.18" />
    </filter>
  </defs>

  <style>
    .fs-reveal { --out: cubic-bezier(.16, 1, .3, 1); }
    .rvl-base { animation: rvl-rise .55s var(--out) 0.05s both; transform-origin: 250px 250px; }
    .rvl-l1 { animation: rvl-rise .55s var(--out) 0.15s both; transform-origin: 250px 250px; }
    .rvl-l2 { animation: rvl-rise .55s var(--out) 0.25s both; transform-origin: 250px 250px; }
    .rvl-l3 { animation: rvl-rise .55s var(--out) 0.35s both; transform-origin: 250px 250px; }
    .rvl-leaf { animation: rvl-rise .6s var(--out) 0.45s both; transform-origin: 250px 250px; }
    
    @keyframes rvl-rise {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .rvl-base, .rvl-l1, .rvl-l2, .rvl-l3, .rvl-leaf { animation: none; }
    }
  </style>

  <g filter="url(#rvl-shadow)">
    <!-- Base Beige/Cream Bottom Half Circle -->
    <path class="rvl-base" d="M 125,250 A 125,125 0 0,0 375,250 Z" fill="url(#rvl-base)"/>

    <!-- Leaflet 1 -->
    <g class="rvl-l1">
      <path d="M 125,210 C 145,210 170,215 170,230 L 170,250 C 140,250 125,235 125,210 Z" fill="url(#rvl-l1)"/>
      <path d="M 125,210 C 145,225 170,240 170,250" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
    </g>

    <!-- Leaflet 2 -->
    <g class="rvl-l2">
      <path d="M 170,175 C 190,175 210,185 210,205 L 210,250 C 185,250 170,240 170,220 Z" fill="url(#rvl-l2)"/>
      <path d="M 170,175 C 190,200 210,225 210,250" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
    </g>

    <!-- Leaflet 3 -->
    <g class="rvl-l3">
      <path d="M 210,140 C 230,140 250,150 250,175 L 250,250 C 220,250 210,240 210,220 Z" fill="url(#rvl-l3)"/>
      <path d="M 210,140 C 230,170 250,210 250,250" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
    </g>

    <!-- Main Leaf -->
    <g class="rvl-leaf">
      <path d="M 250,125 A 125,125 0 0,1 375,250 L 250,250 Z" fill="url(#rvl-leaf)"/>
      <path d="M 250,125 Q 310,185 375,250" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.45"/>
      <path d="M 250,165 Q 295,205 340,250" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
      <path d="M 250,205 Q 280,225 305,250" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.25"/>
    </g>
  </g>
</svg>
