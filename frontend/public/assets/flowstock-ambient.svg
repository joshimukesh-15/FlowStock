<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 120 260 260" width="260" height="260" role="img" aria-label="Logo">
  <title>Logo</title>
  <style>
    /* a slow single highlight sweep across the circle, then rest */
    .sheen{animation:am-light-sweep 3.2s cubic-bezier(.45,0,.2,1) infinite}
    @keyframes am-light-sweep{0%,15%{transform:translateX(-260px)}58%,100%{transform:translateX(260px)}}
    @media (prefers-reduced-motion:reduce){.sheen{display:none}}
  </style>
  <defs>
    <linearGradient id="am-light-base" gradientUnits="userSpaceOnUse" x1="250" y1="252.5" x2="250" y2="375"><stop offset="0" stop-color="#3C3B32"/><stop offset="1" stop-color="#11120D"/></linearGradient>
    <linearGradient id="am-light-quad" gradientUnits="userSpaceOnUse" x1="252.5" y1="125" x2="375" y2="247.5"><stop offset="0" stop-color="#FFFBF4"/><stop offset=".5" stop-color="#EFE8D8"/><stop offset="1" stop-color="#D8CFBC"/></linearGradient>
    <linearGradient id="am-light-c1" gradientUnits="userSpaceOnUse" x1="132.5" y1="207.5" x2="167.5" y2="247.5"><stop offset="0" stop-color="#7A7768"/><stop offset="1" stop-color="#565449"/></linearGradient>
    <linearGradient id="am-light-c2" gradientUnits="userSpaceOnUse" x1="172.5" y1="172.5" x2="207.5" y2="247.5"><stop offset="0" stop-color="#A39C86"/><stop offset="1" stop-color="#857F6C"/></linearGradient>
    <linearGradient id="am-light-c3" gradientUnits="userSpaceOnUse" x1="212.5" y1="137.5" x2="247.5" y2="247.5"><stop offset="0" stop-color="#CFC6AE"/><stop offset="1" stop-color="#B4AC94"/></linearGradient>
  </defs>
  <defs>    <linearGradient id="am-light-sheen-grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity=".4"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<clipPath id="am-light-clip">    <path fill="#000" d="M125.03 252.5A125 125 0 0 0 374.97 252.5Z"/>
    <path fill="#000" d="M132.5 207.5H137.5A30 30 0 0 1 167.5 237.5V247.5H162.5A30 30 0 0 1 132.5 217.5Z"/>
    <path fill="#000" d="M172.5 172.5H177.5A30 30 0 0 1 207.5 202.5V247.5H202.5A30 30 0 0 1 172.5 217.5Z"/>
    <path fill="#000" d="M212.5 137.5H217.5A30 30 0 0 1 247.5 167.5V247.5H242.5A30 30 0 0 1 212.5 217.5Z"/>
    <path fill="#000" d="M252.5 247.5V125.03A125 125 0 0 1 374.97 247.5Z"/>
</clipPath></defs>
    <path fill="url(#am-light-base)" d="M125.03 252.5A125 125 0 0 0 374.97 252.5Z"/>
    <path fill="url(#am-light-c1)" d="M132.5 207.5H137.5A30 30 0 0 1 167.5 237.5V247.5H162.5A30 30 0 0 1 132.5 217.5Z"/>
    <path fill="url(#am-light-c2)" d="M172.5 172.5H177.5A30 30 0 0 1 207.5 202.5V247.5H202.5A30 30 0 0 1 172.5 217.5Z"/>
    <path fill="url(#am-light-c3)" d="M212.5 137.5H217.5A30 30 0 0 1 247.5 167.5V247.5H242.5A30 30 0 0 1 212.5 217.5Z"/>
    <path fill="url(#am-light-quad)" d="M252.5 247.5V125.03A125 125 0 0 1 374.97 247.5Z"/>
  <g clip-path="url(#am-light-clip)"><rect class="sheen" x="80" y="110" width="60" height="280" fill="url(#am-light-sheen-grad)" transform="skewX(-18)"/></g>
