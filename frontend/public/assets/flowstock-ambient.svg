<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="FlowStock ambient background mark">
  <title>FlowStock ambient</title>
  <defs>
    <linearGradient id="ab-beige" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#d4b896"/>
    </linearGradient>
    <linearGradient id="ab-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ab-l3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ab-l2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="ab-l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="ab-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <g filter="url(#ab-blur)" opacity="0.12">
    <path d="M 125,250 A 125,125 0 0,0 375,250 Z" fill="url(#ab-beige)"/>
    <path d="M 250,125 A 125,125 0 0,1 375,250 L 250,250 Z" fill="url(#ab-leaf)"/>
    <path d="M 210,140 C 230,140 250,150 250,175 L 250,250 C 220,250 210,240 210,220 Z" fill="url(#ab-l3)"/>
    <path d="M 170,175 C 190,175 210,185 210,205 L 210,250 C 185,250 170,240 170,220 Z" fill="url(#ab-l2)"/>
    <path d="M 125,210 C 145,210 170,215 170,230 L 170,250 C 140,250 125,235 125,210 Z" fill="url(#ab-l1)"/>
  </g>
