<svg xmlns="http://www.w3.org/2000/svg" class="fs-a" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="FlowStock" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>FlowStock</title>
  <style>
    /* resting state is the default; one packet crosses the axis, then the mark holds still */
    .fs-a-dot{transform-box:fill-box;transform-origin:center;animation:fs-a-ack 3.6s cubic-bezier(.4,0,.2,1) infinite}
    .fs-a-k1{stroke-dasharray:26 220;stroke-dashoffset:29;animation:fs-a-k1 3.6s infinite}
    .fs-a-k2{stroke-dasharray:12 220;stroke-dashoffset:15;animation:fs-a-k2 3.6s infinite}

    @keyframes fs-a-k1{0%,6%{stroke-dashoffset:29;animation-timing-function:cubic-bezier(.65,0,.35,1)}58%,100%{stroke-dashoffset:-103}}
    @keyframes fs-a-k2{0%,6%{stroke-dashoffset:15;animation-timing-function:cubic-bezier(.65,0,.35,1)}58%,100%{stroke-dashoffset:-117}}
    @keyframes fs-a-ack{0%,23.2%,43.2%,100%{transform:scale(1)}30.2%{transform:scale(1.3)}}

    @media (prefers-reduced-motion:reduce){.fs-a-k1,.fs-a-k2,.fs-a-dot{animation:none}}
  </style>

  <rect x=".9" y=".9" width="118.2" height="118.2" rx="26" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.8"/>

  <path d="M60 29 86.85 44.5 86.85 75.5 60 91 33.15 75.5 33.15 44.5Z" fill="#23262F"/>

  <path d="M60 26.6V93.4" fill="none" stroke="#B6FF2E" stroke-width="2" stroke-linecap="round" opacity=".38"/>
  <g fill="none" stroke="#B6FF2E" stroke-width="2" stroke-linecap="round">
    <path class="fs-a-k1" pathLength="100" d="M60 26.6V93.4" opacity=".32"/>
    <path class="fs-a-k2" pathLength="100" d="M60 26.6V93.4" opacity="1"/>
  </g>

  <circle class="fs-a-dot" cx="60" cy="60" r="3.5" fill="#B6FF2E"/>
</svg>
