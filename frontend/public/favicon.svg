<svg xmlns="http://www.w3.org/2000/svg" viewBox="95 95 310 310" width="32" height="32" role="img" aria-label="FlowStock">
  <title>FlowStock</title>
  <defs>
    <linearGradient id="fg-beige" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#d4b896"/>
    </linearGradient>
    <linearGradient id="fg-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="fg-l3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="fg-l2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="fg-l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- White Background Squircle -->
  <rect x="95" y="95" width="310" height="310" rx="64" fill="#ffffff"/>
  <!-- Beige Base -->
  <path d="M 125,250 A 125,125 0 0,0 375,250 Z" fill="url(#fg-beige)"/>
  <!-- Main Blue Leaf -->
  <path d="M 250,125 A 125,125 0 0,1 375,250 L 250,250 Z" fill="url(#fg-leaf)"/>
  <path d="M 250,125 Q 310,185 375,250" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Column 3 -->
  <path d="M 210,140 C 230,140 250,150 250,175 L 250,250 C 220,250 210,240 210,220 Z" fill="url(#fg-l3)"/>
  <path d="M 210,140 C 230,170 250,210 250,250" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.25"/>
  <!-- Column 2 -->
  <path d="M 170,175 C 190,175 210,185 210,205 L 210,250 C 185,250 170,240 170,220 Z" fill="url(#fg-l2)"/>
  <path d="M 170,175 C 190,200 210,225 210,250" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.25"/>
  <!-- Column 1 -->
  <path d="M 125,210 C 145,210 170,215 170,230 L 170,250 C 140,250 125,235 125,210 Z" fill="url(#fg-l1)"/>
  <path d="M 125,210 C 145,225 170,240 170,250" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.25"/>
</svg>
