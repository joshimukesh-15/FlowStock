<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 12 84 96" width="84" height="96" role="img" aria-label="Loading">
  <title>Loading</title>
  <style>
    /* a fading comet orbits the rim; the arrow breathes once per lap */
    .t1{stroke-dasharray:34 66;opacity:0;animation:fs-o1 1.6s linear infinite}
    .t2{stroke-dasharray:22 78;opacity:0;animation:fs-o2 1.6s linear infinite}
    .t3{stroke-dasharray:12 88;opacity:0;animation:fs-o3 1.6s linear infinite}
    .t4{stroke-dasharray:5 95;opacity:0;animation:fs-o4 1.6s linear infinite}
    .k{animation:fs-br 1.6s cubic-bezier(.4,0,.2,1) infinite}
    @keyframes fs-o1{from{stroke-dashoffset:34;opacity:.16}to{stroke-dashoffset:-66;opacity:.16}}
    @keyframes fs-o2{from{stroke-dashoffset:22;opacity:.3}to{stroke-dashoffset:-78;opacity:.3}}
    @keyframes fs-o3{from{stroke-dashoffset:12;opacity:.6}to{stroke-dashoffset:-88;opacity:.6}}
    @keyframes fs-o4{from{stroke-dashoffset:5;opacity:1}to{stroke-dashoffset:-95;opacity:1}}
    .k{opacity:0}
    @keyframes fs-br{0%,100%{opacity:0}50%{opacity:.75}}
    @media (prefers-reduced-motion:reduce){.t1,.t2,.t3,.t4{display:none}}
  </style>
